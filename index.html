<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Charly IA Clips</title>
</head>
<body>
  <div id="resultado">Aquí aparecerá el resultado de la IA.</div>
  <br>
  <button onclick="procesarVideo()">Generar Clip</button>

  <input type="text" id="videoUrl" placeholder="Pega aquí el enlace de YouTube">

  <script>
    const apiKey = "AQ.Ab8RN6L5Z9SnMvvCL260zAKOgPbZIG37pR45q6yTXYS6F0-f2A";

    async function procesarVideo() {
      const url = document.getElementById('videoUrl').value;
      const resultadoDiv = document.getElementById('resultado');

      if (!url) {
        alert('Por favor ingresa un enlace.');
        return;
      }

      resultadoDiv.innerText = "Procesando con la IA, por favor espera...";

      const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`;

      try {
        const response = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{
              parts: [{ text: "Analiza este video de YouTube y genera un resumen o descripción para crear clips automáticamente: " + url }]
            }]
          })
        });

        const data = await response.json();

        if (data.candidates && data.candidates[0].content.parts[0].text) {
          resultadoDiv.innerText = data.candidates[0].content.parts[0].text;
        } else {
          resultadoDiv.innerText = "No se pudo generar el resumen.";
        }
      } catch (error) {
        resultadoDiv.innerText = "Hubo un error al procesar la solicitud: " + error.message;
      }
    }
  </script>
</body>
</html>
